# sievebox profile registry. Loaded by the Python engine.
#
# Schema:
#   modules: reusable permission bundles
#     extends     base modules to inherit (expanded base-first)
#     setenv      host env vars to forward into the sandbox
#     shell_init  raw bash run inside the sandbox at launch
#     filesystem  ro / rw path lists; ~ and $VAR expanded, existence-gated,
#                 entries with an unset $VAR are skipped
#     sockets     named host sockets: wayland, pulse, pipewire
#     devices     device names under /dev (e.g. dri)
#     raw_args    raw bwrap directives (token lists); {bin} -> target binary,
#                 ~ -> $HOME. Appended after core args in module order.
#   apps: binary -> { modules, root, color, allow_home, env }
#     color       256-color code for the sandbox prompt (optional; defaults to 39)
#     allow_home default false   (permit running directly in $HOME)
#     root       module driving the prompt color (default: first module)
#     env        values set in the host env only if currently unset
#   core: base sandbox applied to every app (args / setenv)
#
# Personal modules and app overrides live in ~/.config/sievebox/profiles.d/*.yaml

# Base sandbox applied to every app, in order. Each `args` entry is a bwrap
# directive (token list); {bin} -> target binary, ~ -> $HOME.
# ADVANCED: this is the security floor; edit with care.
core:
  args:
    - [--unshare-all]
    - [--unshare-user]
    - [--disable-userns]
    - [--hostname, "sievebox-{bin}"]
    - [--die-with-parent]
    - [--new-session]
    - [--cap-drop, ALL]
    - [--clearenv]
    - [--tmpfs, /]
    - [--dev, /dev]
    - [--proc, /proc]
    - [--tmpfs, /tmp]
    - [--tmpfs, /run]
    - [--ro-bind, /usr, /usr]
    - [--symlink, /usr/sbin, /sbin]
    - [--symlink, /usr/bin, /bin]
    - [--symlink, /usr/lib, /lib]
    - [--symlink, /usr/lib64, /lib64]
    - [--ro-bind, /etc/alternatives, /etc/alternatives]
    - [--ro-bind-try, /etc/fonts, /etc/fonts]
    - [--ro-bind-try, /etc/hosts, /etc/hosts]
    - [--ro-bind-try, /etc/host.conf, /etc/host.conf]
    - [--ro-bind-try, /etc/nsswitch.conf, /etc/nsswitch.conf]
    - [--ro-bind-try, /etc/group, /etc/group]
    - [--ro-bind-try, /etc/passwd, /etc/passwd]
    - [--ro-bind-try, /etc/localtime, /etc/localtime]
    - [--tmpfs, /var/cache/fontconfig]
    - [--ro-bind-try, "~/.cache/fontconfig", "~/.cache/fontconfig"]
    - [--ro-bind-try, /etc/ld.so.conf.d, /etc/ld.so.conf.d]
    - [--ro-bind-try, /etc/ld.so.cache, /etc/ld.so.cache]
    - [--ro-bind-try, /etc/ld.so.conf, /etc/ld.so.conf]
    - [--ro-bind-try, "~/.fonts", "~/.fonts"]
    - [--ro-bind-try, "~/.config/fontconfig", "~/.config/fontconfig"]
    - [--ro-bind-try, "~/.config/user-dirs.dirs", "~/.config/user-dirs.dirs"]
    - [--ro-bind-try, "~/.local/share/icons", "~/.local/share/icons"]
    - [--ro-bind-try, "~/.config/kdedefaults", "~/.config/kdedefaults"]
    - [--ro-bind-try, "~/.config/kdeglobals", "~/.config/kdeglobals"]
    - [--ro-bind-try, "~/.config/kwinrc", "~/.config/kwinrc"]
    - [--ro-bind-try, "~/.local/share/plasma", "~/.local/share/plasma"]
    - [--ro-bind-try, "~/.local/share/color-schemes/", "~/.local/share/color-schemes/"]
    - [--ro-bind, /etc/profile, /etc/profile]
    - [--ro-bind, /etc/profile.d, /etc/profile.d]
    - [--ro-bind-try, "~/.config/gtk-3.0", "~/.config/gtk-3.0"]
    - [--ro-bind-try, "~/.config/gtk-4.0", "~/.config/gtk-4.0"]
    - [--ro-bind-try, "~/.config/gtkrc", "~/.config/gtkrc"]
    - [--ro-bind-try, "~/.config/gtkrc-2.0", "~/.config/gtkrc-2.0"]
    - [--ro-bind-try, "/etc/os-release", "/etc/os-release"]
  # Host env vars forwarded into the cleared sandbox (only if set).
  setenv: [HOME, PATH, USER, LOGNAME, TERM, COLORTERM, LANG, LANGUAGE, LC_ALL, LC_CTYPE, XDG_RUNTIME_DIR, XDG_SESSION_TYPE, XDG_CURRENT_DESKTOP, XDG_SESSION_DESKTOP]

modules:

  # Module that doesn't have anything, useful for testing base (core) sandbox.
  simple_module:

  network:
    raw_args:
      - [--share-net]
      - [--ro-bind-try, /etc/resolv.conf, /etc/resolv.conf]
      - [--ro-bind-try, /etc/ssl, /etc/ssl]
      - [--ro-bind-try, /etc/pki, /etc/pki]
      - [--ro-bind-try, /etc/ca-certificates, /etc/ca-certificates]

  # Wayland-only sessions. Still required if using Xwayland.
  # For X11 apps look at 'x11' (private, safer) and 'x11-dangerous' (host, dangerous) modules.
  gui:
    sockets: [wayland]

  # Forced rootful private X server. The 'x11' module falls back to this.
  # Tries to set the geometry of the rootful window according to:
  # SIEVEBOX_X11_GEOMETRY env variable > primary monitor geometry from wayland-info > 1920x1080.
  x11-rootful:
    shell_init:
      - &rootful_x11 |
        start_rootful_x11() {
          PRIMARY_GEOM=wayland-info | sed -n 's/.*logical_width: \([0-9]*\), logical_height: \([0-9]*\).*/\1x\2/p' | head -1
          GEOM=${SIEVEBOX_X11_GEOMETRY:-$PRIMARY_GEOM}
          Xwayland :10 -geometry "${GEOM:-1920x1080}" -nolisten tcp >/tmp/sievebox-x11.log 2>&1 &
          for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X10 ] && break; sleep 0.1; done
          export DISPLAY=:10
        }
      - start_rootful_x11
    incompatible: [x11, x11-dangerous]

  # Preferred private X server: rootless via xwayland-satellite when
  # available, else rootful Xwayland (using x11-rootful shell_init).
  # Never touches the host X session.
  x11:
    shell_init:
      - *rootful_x11
      - |
        if [ -n "${WAYLAND_DISPLAY:-}" ]; then
          if command -v xwayland-satellite >/dev/null; then
            xwayland-satellite >/tmp/sievebox-x11.log 2>&1 &
            for i in $(seq 1 50); do
              D=$(sed -n 's/.*Connected to Xwayland on :\([0-9]*\).*/\1/p' /tmp/sievebox-x11.log | head -1)
              [ -n "$D" ] && break
              sleep 0.1
            done
            [ -n "$D" ] && export DISPLAY=":$D"
          fi
          if [ -z "$D" ] && command -v Xwayland >/dev/null; then
            pkill -x xwayland-satellite 2>/dev/null
            start_rootful_x11
          fi
        fi
    incompatible: [x11-rootful, x11-dangerous]

  # Weak opt-in: host X session passthrough (can read/inject into other X11
  # clients). Mutually exclusive with 'x11' and 'x11-rootful' modules.
  # Besides sandbox being Wayland-first, the x11 socket should allow connections
  # for X11 only sessions.
  x11-dangerous:
    sockets: [x11]
    incompatible: [x11, x11-rootful]

  audio:
    sockets: [pulse, pipewire]

  # Profile for mesa focused on amdgpu.
  gpu:
    devices: [dri]
    filesystem:
      ro:
        - ~/.cache/mesa_shader_cache
        - ~/.cache/radv_builtin_shaders
        - /sys/dev
        - /sys/devices
        - /etc/vulkan
        - ~/.local/share/vulkan

  # Conda module: shows one use case of the shell_init attribute;
  # preserves the conda default PS1 override while also auto activating an
  # environment according to the presence of an env variable (CONDA_ENV).
  conda:
    setenv: [CONDA_ENV]
    shell_init: |
      export CONDA_EXE="/usr/bin/conda"
      if [ "$0" = "conda" ]; then
        [ -f /etc/profile.d/conda.sh ] && source /etc/profile.d/conda.sh
        if [ "$#" -gt 1 ]; then
          shift
          conda "$@"
        else
          printf "Use '\033[38;5;${SIEVEBOX_COLOR}mconda activate <env>\033[0m' to activate an environment."
        fi
        echo ""
        exec bash --login -i
      fi
      if [ -n "${CONDA_ENV:-}" ] && [ -f /etc/profile.d/conda.sh ]; then
        source /etc/profile.d/conda.sh
        conda activate "$CONDA_ENV"
        printf "\033[38;5;${SIEVEBOX_COLOR}m[sievebox]\033[0m Attached to Conda environment: %s\n" "$CONDA_DEFAULT_ENV"
      fi
    filesystem:
      ro: [/etc/conda]
      rw: [~/.conda, ~/.cache/conda, ~/.cache/pip, ~/.condarc, ~/.ipython, ~/ccache]

  # Focused on node installs with pnpm.
  node:
    setenv: [PNPM_HOME]
    filesystem:
      ro: [~/.npmrc]
      rw:
        - $PNPM_HOME
        - ~/.npm
        - ~/.cache/pnpm
        - ~/.cache/node
        - ~/.config/pnpm
        - ~/.bun
        - ~/.node_repl_history
        - ~/.cache/ccache

  rust:
    filesystem:
      rw:
        - ~/.cargo
        - ~/.cache/ccache
        - ~/.rustup
  
  # android_dev (without device kvm).
  android_dev:
    setenv: [ANDROID_HOME, NDK_HOME, JAVA_HOME]
    extends: [network]
    filesystem:
      rw:
        - ~/Android
        - ~/.android
        - ~/.composer
        - ~/.gradle
        - ~/.jdks
        - ~/.java
        - ~/.local/share/Google
        - ~/.cache/Google
      ro:
        - /opt/android-studio

  # /dev/kvm is too dangerous to pass into android_dev directly if user will not
  # use an emulator. Preferred to have a module with it to accompany with
  # --modules parameter.
  # X11 (Xwayland or not) is optional as android emulator AVD can be run
  # headless (so it wouldn't need a display server to render itself).
  android_emul:
    devices: [kvm]
    extends: [android_dev, gpu]
    filesystem:
      rw:
        - ~/.emulator_console_auth_token

apps:
  conda:    { modules: [conda, network], color: 184 }
  "npm, pnpm, yarn, npx, node, bun": { modules: [node, network], color: 226 }
  bash:     { modules: [simple_module], color: 183 }
  emulator: { modules: [android_emul] } # made for headless, add gui and audio if you want them
